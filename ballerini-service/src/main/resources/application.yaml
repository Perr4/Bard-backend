spring:
  application:
    name: ballerini-service


  datasource:
    url: ${DB_URL:jdbc:postgresql://192.168.1.22/postgres}
    schema: bard
    username: ${DB_USERNAME:bard}
    password: ${DB_PASSWORD:0000}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:

        include: health,info
server:
  port: 8081