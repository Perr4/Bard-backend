spring:
  application:
    name: learning-service


  datasource:
    url: ${DB_URL:jdbc:postgresql://172.21.1.33:5569/lab-mi?schema=chronos}
    username: ${DB_USERNAME:laboratorio}
    password: ${DB_PASSWORD:laboratorio}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
#        default_schema: chronos
        format_sql: true
    open-in-view: false
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info