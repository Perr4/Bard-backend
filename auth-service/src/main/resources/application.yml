server:
  port: 7999

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://192.168.1.22/postgres}
    schema: bard
    username: ${DB_USERNAME:bard}
    password: ${DB_PASSWORD:0000}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
chronos:
  security:
    jwt-secret: ${CHRONOS_JWT_SECRET:chronos-super-secret-key-for-development-only-please-change-2026-minimum-512-bit-secret-key}
    jwt-expiration-minutes: ${CHRONOS_JWT_EXPIRATION_MINUTES:120}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
