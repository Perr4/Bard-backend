server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://172.21.1.33:5569/lab-mi?schema=chronos}
    username: ${DB_USERNAME:laboratorio}
    password: ${DB_PASSWORD:laboratorio}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

chronos:
  kafka:
    topics:
      user-registered: chronos.user.registered
  security:
    jwt-secret: ${CHRONOS_JWT_SECRET:chronos-super-secret-key-for-development-only-please-change-2026-minimum-512-bit-secret-key}
    jwt-expiration-minutes: ${CHRONOS_JWT_EXPIRATION_MINUTES:120}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
