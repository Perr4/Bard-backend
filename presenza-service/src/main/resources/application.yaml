spring:
  application:
    name: presenza-service


  datasource:
    url: ${DB_URL:jdbc:postgresql://192.168.1.22/postgres}
    schema: bard
    username: ${DB_USERNAME:bard}
    password: ${DB_PASSWORD:0000}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  # Metriche via OTLP. In Spring Boot 4.1 la chiave corretta e'
  # management.otlp.metrics.export.* (la forma metrics.otlp.* e' quella
  # di Boot 3.x e oggi non viene letta: resterebbe un export inattivo).
  # L'endpoint arriva dalla variabile OTEL_EXPORTER_OTLP_ENDPOINT, che il
  # compose imposta su http://otel-collector:4318.
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 30s
  # Campo tracing rimosso: in Boot 4.1.1 la chiave management.tracing.*
  # non esiste piu' (c'era fino a 3.5). Le tracce del servizio arrivano
  # dall'agente OpenTelemetry java (vedi Dockerfile), non da Spring.

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha

server:
  port: 8082